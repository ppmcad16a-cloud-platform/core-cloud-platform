name: Reusable Java Application Pipeline

on:
  workflow_call:
    inputs:
      java-version:
        required: false
        type: string
        default: "21"

      run-tests:
        required: false
        type: boolean
        default: true

      build-docker:
        description: "Build Docker image after successful Java build"
        required: false
        type: boolean
        default: false

      image-name:
        description: "Docker image name"
        required: false
        type: string
        default: ""  

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout application
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: maven

      - name: Show Java version
        run: java -version

      - name: Compile
        run: mvn clean compile

      - name: Run tests
        if: ${{ inputs.run-tests }}
        run: mvn test

      - name: Package
        run: mvn package -DskipTests

      # ------------------------------------------------------
      # Upload packaged Java application.
      #
      # Jobs execute on independent runners, so target/*.jar
      # must be transferred to the Docker job.
      # ------------------------------------------------------
      - name: Upload Java build artifact
        if: ${{ inputs.build-docker }}
        uses: actions/upload-artifact@v4
        with:
          name: java-build-artifact
          path: target/*.jar
          retention-days: 1  

        # ==========================================================
  # Container Build
  #
  # This job runs only after the Java build succeeds.
  #
  # Instead of duplicating Docker logic here, we reuse the
  # centralized docker-build.yaml workflow.
  # ==========================================================
    docker:
    needs: build

    if: ${{ inputs.build-docker }}

    uses: ppmcad16a-cloud-platform/core-cloud-platform/.github/workflows/docker-build.yaml@main

    with:
      image-name: ${{ inputs.image-name }}

      # Tell Docker workflow which artifact it needs.
      application-artifact: java-build-artifact