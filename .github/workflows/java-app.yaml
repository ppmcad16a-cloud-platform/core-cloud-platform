# ============================================================
# Reusable Java (Maven) Application Pipeline
#
# Used by: identity-service
#
#   build  -> compile, test, coverage gate, package (one Maven run)
#   docker -> (optional) build + scan the container image
#             using docker-build.yaml
# ============================================================

name: Reusable Java Application Pipeline

on:
  workflow_call:
    inputs:
      java-version:
        required: false
        type: string
        default: "21"

      run-tests:
        required: false
        type: boolean
        default: true

      # Folder containing pom.xml ("." = repository root).
      working-directory:
        description: "Folder that contains pom.xml"
        required: false
        type: string
        default: "."

      build-docker:
        description: "Build Docker image after successful Java build"
        required: false
        type: boolean
        default: false

      image-name:
        description: "Docker image name (required when build-docker is true)"
        required: false
        type: string
        default: ""

      fail-on-vulnerabilities:
        description: "Fail the Docker job on fixable HIGH/CRITICAL vulnerabilities"
        required: false
        type: boolean
        default: true

      push-images:
        description: "Push the scanned image to the 3 cloud registries (main branch only)"
        required: false
        type: boolean
        default: false

      deploy-after-push:
        description: "After pushing, ask Jenkins to deploy the image to GCP -> Azure -> AWS"
        required: false
        type: boolean
        default: false

# Least privilege: read the code, nothing else.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    timeout-minutes: 30

    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Checkout application
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fail early with a clear message instead of a confusing
      # "invalid reference format" error inside Docker later.
      - name: Validate inputs
        if: ${{ inputs.build-docker && inputs.image-name == '' }}
        run: |
          echo "::error::build-docker is true but image-name is empty"
          exit 1

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: maven
          cache-dependency-path: ${{ inputs.working-directory }}/pom.xml

      # ------------------------------------------------------
      # One Maven run does everything:
      #   verify = compile + unit tests + coverage check (JaCoCo)
      #            + package the JAR
      # -B  = batch mode (no colour codes / prompts in CI logs)
      # -ntp = do not print every downloaded dependency
      # ------------------------------------------------------
      - name: Build, test and package
        if: ${{ inputs.run-tests }}
        run: mvn -B -ntp verify

      - name: Package (tests skipped)
        if: ${{ !inputs.run-tests }}
        run: mvn -B -ntp package -DskipTests

      # ------------------------------------------------------
      # Jobs execute on independent runners, so target/*.jar
      # must be transferred to the Docker job.
      # ------------------------------------------------------
      - name: Upload Java build artifact
        if: ${{ inputs.build-docker }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: java-build-artifact
          path: ${{ inputs.working-directory }}/target/*.jar
          retention-days: 1
          if-no-files-found: error

  # ==========================================================
  # Container Build
  #
  # Runs only after the Java build succeeds. Docker logic lives
  # in ONE place (docker-build.yaml) for every language.
  # ==========================================================
  docker:
    needs: build

    if: ${{ inputs.build-docker }}

    # Passed on to docker-build: lets it log in to the clouds.
    permissions:
      contents: read
      id-token: write

    uses: ppmcad16a-cloud-platform/core-cloud-platform/.github/workflows/docker-build.yaml@v2

    with:
      image-name: ${{ inputs.image-name }}
      docker-context: ${{ inputs.working-directory }}
      dockerfile: ${{ inputs.working-directory }}/Dockerfile
      application-artifact: java-build-artifact
      fail-on-vulnerabilities: ${{ inputs.fail-on-vulnerabilities }}
      push-images: ${{ inputs.push-images }}

  # ==========================================================
  # Deploy: once the image is in all 3 registries,
  # ask Jenkins to roll it out GCP -> Azure -> AWS.
  # ==========================================================
  deploy:
    needs: docker

    if: ${{ inputs.deploy-after-push && needs.docker.outputs.pushed == 'true' }}

    permissions:
      contents: read
      id-token: write

    uses: ppmcad16a-cloud-platform/core-cloud-platform/.github/workflows/trigger-deploy.yaml@v2

    with:
      service: ${{ needs.docker.outputs.image-name }}
      image-tag: ${{ needs.docker.outputs.image-tag }}
