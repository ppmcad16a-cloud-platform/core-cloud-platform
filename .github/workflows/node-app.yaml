# ============================================================
# Reusable Node.js Application Pipeline
#
# Used by: api-gateway-service, catalog-service,
#          notification-service, client-service, seed-db-service
#
#   build  -> npm ci, tests (with the repo's coverage gate), build
#   docker -> (optional) build + scan the container image
#             using docker-build.yaml
# ============================================================

name: Reusable Node Application Pipeline

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: "22"

      run-tests:
        required: false
        type: boolean
        default: true

      # Folder containing package.json ("." = repository root).
      working-directory:
        description: "Folder that contains package.json"
        required: false
        type: string
        default: "."

      build-docker:
        description: "Build Docker image after successful Node build"
        required: false
        type: boolean
        default: false

      image-name:
        description: "Docker image name (required when build-docker is true)"
        required: false
        type: string
        default: ""

      fail-on-vulnerabilities:
        description: "Fail the Docker job on fixable HIGH/CRITICAL vulnerabilities"
        required: false
        type: boolean
        default: true

# Least privilege: read the code, nothing else.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    timeout-minutes: 20

    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Checkout application
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate inputs
        if: ${{ inputs.build-docker && inputs.image-name == '' }}
        run: |
          echo "::error::build-docker is true but image-name is empty"
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      # npm ci installs EXACTLY what package-lock.json says
      # (reproducible builds). It fails if the lock file is missing
      # or out of date - that is intentional.
      - name: Install dependencies
        run: npm ci

      - name: Run tests
        if: ${{ inputs.run-tests }}
        run: npm test

      - name: Build application
        run: npm run build --if-present

  # ==========================================================
  # Container Build (same shared Docker workflow as Java/Python)
  # The Dockerfile builds the Node app itself (multi-stage),
  # so no artifact is handed over.
  # ==========================================================
  docker:
    needs: build

    if: ${{ inputs.build-docker }}

    uses: ppmcad16a-cloud-platform/core-cloud-platform/.github/workflows/docker-build.yaml@v1

    with:
      image-name: ${{ inputs.image-name }}
      docker-context: ${{ inputs.working-directory }}
      dockerfile: ${{ inputs.working-directory }}/Dockerfile
      fail-on-vulnerabilities: ${{ inputs.fail-on-vulnerabilities }}
