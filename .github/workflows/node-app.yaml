name: Reusable Node Application Pipeline

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: "20"

      run-tests:
        required: false
        type: boolean
        default: true

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout application
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        if: ${{ inputs.run-tests }}
        run: npm test

      - name: Build application
        run: npm run build --if-present