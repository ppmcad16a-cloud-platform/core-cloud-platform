# ============================================================
# Reusable Docker Build Workflow
#
# Purpose:
#   1. Checkout the calling application's source code
#   2. Generate an immutable image tag
#   3. Build the application's Docker image
#   4. Scan the image with Trivy (blocks HIGH/CRITICAL with a fix)
#   5. Keep the scan report as a workflow artifact
#   6. ONLY on a push to main (and push-images: true):
#      push the SAME scanned image to
#      ECR (AWS) + ACR (Azure) + Artifact Registry (GCP)
#
# One cloud down? (v2.2.0) The image still goes to every
# registry that answers; the run stays green with a warning.
# It only fails when NO registry got the image. The automatic
# deploy waits until all 3 have it (re-run the workflow when
# the cloud is back - registries that already have the tag
# are skipped, the missing one is filled in).
#
# Security notes:
#   - Every third-party action is pinned to a full commit SHA.
#     A tag like "v4" can be moved by whoever controls the action
#     repository; a SHA cannot. (In March 2026 attackers re-pointed
#     tags of a popular scanner action - pinning protects us.)
#   - Trivy is NOT run through a wrapper action. We download the
#     official release and verify its SHA-256 checksum first.
#   - No cloud keys are stored anywhere. GitHub gives this job a
#     signed identity card (OIDC token); each cloud accepts it only
#     for the main branch of our service repos (see the
#     ci-push.tf files in aws/azure/gcp-platform).
# ============================================================

name: Reusable Docker Build

on:
  workflow_call:
    inputs:

      # Name of the Docker image. Upper-case letters are lowered
      # automatically because Docker rejects them.
      # Example: identity-service
      image-name:
        description: "Docker image name"
        required: true
        type: string

      # Folder that is sent to "docker build" (the build context).
      # "." means the repository root.
      docker-context:
        description: "Docker build context"
        required: false
        type: string
        default: "."

      # Location of the Dockerfile relative to the repository root.
      dockerfile:
        description: "Path to Dockerfile"
        required: false
        type: string
        default: "./Dockerfile"

      # Java services build their JAR in a previous job and hand it
      # over as an artifact. Empty means "nothing to download".
      application-artifact:
        description: "GitHub Actions artifact containing application build output"
        required: false
        type: string
        default: ""

      # Where (inside the docker context) the artifact is unpacked.
      application-artifact-path:
        description: "Folder, relative to docker-context, to download the artifact into"
        required: false
        type: string
        default: "target"

      # true  = fail the pipeline when Trivy finds HIGH/CRITICAL
      #         vulnerabilities that already have a fix available.
      # false = report only (use temporarily, never as the default).
      fail-on-vulnerabilities:
        description: "Fail the build on fixable HIGH/CRITICAL vulnerabilities"
        required: false
        type: boolean
        default: true

      trivy-version:
        description: "Trivy release to use (without the leading v)"
        required: false
        type: string
        default: "0.74.0"

      # true = after a successful scan, push to the 3 cloud registries.
      # Even when true, pushing only happens for a push to main;
      # pull requests are always build + scan only.
      push-images:
        description: "Push the scanned image to ECR, ACR and Artifact Registry (main branch only)"
        required: false
        type: boolean
        default: false

    outputs:

      # Makes the generated tag available to the calling workflow.
      image-tag:
        description: "Generated Docker image tag"
        value: ${{ jobs.docker-build.outputs.image-tag }}

      image-name:
        description: "Normalised (lower-case) image name"
        value: ${{ jobs.docker-build.outputs.image-name }}

      pushed:
        description: "'true' when the image is now in all 3 registries"
        value: ${{ jobs.docker-build.outputs.pushed }}

      pushed-to:
        description: "Clouds whose registry has the image, e.g. 'aws,gcp' (empty when nothing was pushed)"
        value: ${{ jobs.docker-build.outputs.pushed-to }}

# Least privilege: this workflow only needs to read the code.
# (The job below adds id-token: write - only to log in to the clouds.)
permissions:
  contents: read

# Where images go. These are addresses and IDs, not secrets.
env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 722867460821.dkr.ecr.ap-south-1.amazonaws.com
  AWS_PUSH_ROLE_PREFIX: arn:aws:iam::722867460821:role/gha-push-
  ACR_NAME: acrmern0botwx
  AZURE_CLIENT_ID: 8b73b640-2826-4a18-a033-2d707eb67be6
  AZURE_TENANT_ID: 0fd463ca-1b22-4674-bea5-699c2e0ad98b
  AZURE_SUBSCRIPTION_ID: 9c0602c2-72a4-4432-a192-7abf998e2b60
  GAR_REGISTRY: asia-south1-docker.pkg.dev/project-899ced78-a554-40c2-96c/mern
  GCP_WIF_PROVIDER: projects/692591977615/locations/global/workloadIdentityPools/github/providers/github-oidc
  GCP_PUSH_SERVICE_ACCOUNT: gha-push@project-899ced78-a554-40c2-96c.iam.gserviceaccount.com

jobs:

  docker-build:
    name: Build and Scan Docker Image

    runs-on: ubuntu-latest

    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write # ask GitHub for an identity card (used only by the push steps)

    env:
      # "true" only for a push to main with push-images enabled.
      PUSH: ${{ inputs.push-images && github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    outputs:
      image-tag: ${{ steps.version.outputs.image-tag }}
      image-name: ${{ steps.version.outputs.image-name }}
      pushed: ${{ steps.push.outputs.pushed || 'false' }}
      pushed-to: ${{ steps.push.outputs.pushed-to || '' }}

    steps:

      # ------------------------------------------------------
      # Step 1: Checkout application repository
      #
      # Because this reusable workflow is called by an
      # application repository, checkout checks out the
      # application's source code.
      #
      # persist-credentials: false -> the GitHub token is not
      # left behind in .git/config where later steps could read it.
      # ------------------------------------------------------
      - name: Checkout application
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ------------------------------------------------------
      # Download application build output when supplied.
      #
      # Java applications use this to retrieve the JAR
      # produced by the previous build job.
      # ------------------------------------------------------
      - name: Download application artifact
        if: ${{ inputs.application-artifact != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.application-artifact }}
          path: ${{ inputs.docker-context }}/${{ inputs.application-artifact-path }}

      # ------------------------------------------------------
      # Step 2: Generate image name + version
      #
      # Example tag:  main-a1b2c3d
      #
      # The commit SHA gives traceability from a running
      # container back to the exact source code.
      # ------------------------------------------------------
      - name: Generate image tag
        id: version
        shell: bash
        env:
          RAW_IMAGE_NAME: ${{ inputs.image-name }}
        run: |
          if [ -z "${RAW_IMAGE_NAME}" ]; then
            echo "::error::image-name input is empty"
            exit 1
          fi

          IMAGE_NAME="$(echo "${RAW_IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          SHORT_SHA="${GITHUB_SHA::7}"
          BRANCH="$(echo "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" | tr '/' '-' | tr '[:upper:]' '[:lower:]')"
          IMAGE_TAG="${BRANCH}-${SHORT_SHA}"

          echo "Image: ${IMAGE_NAME}:${IMAGE_TAG}"
          echo "image-name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "image-tag=${IMAGE_TAG}"   >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------
      # Step 3: Setup Docker Buildx
      #
      # Buildx is the modern Docker builder; it supports the
      # GitHub Actions layer cache used below.
      # ------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # ------------------------------------------------------
      # Step 4: Build Docker image
      #
      # load: true  -> keep the image in the local Docker engine
      #                so Trivy can scan it in the next step.
      # cache-*     -> re-use unchanged layers from earlier runs
      #                (much faster builds, less CI time).
      # ------------------------------------------------------
      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.docker-context }}
          file: ${{ inputs.dockerfile }}
          push: false
          load: true
          cache-from: type=gha,scope=${{ steps.version.outputs.image-name }}
          cache-to: type=gha,mode=max,scope=${{ steps.version.outputs.image-name }}
          tags: |
            ${{ steps.version.outputs.image-name }}:${{ steps.version.outputs.image-tag }}

      # ------------------------------------------------------
      # Step 5: Install Trivy safely
      #
      # Download the official release + its checksum list and
      # refuse to continue if the file does not match.
      # ------------------------------------------------------
      - name: Install Trivy (checksum verified)
        shell: bash
        env:
          TRIVY_VERSION: ${{ inputs.trivy-version }}
        run: |
          set -euo pipefail
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          file="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfLO "${base}/${file}"
          curl -sSfLO "${base}/trivy_${TRIVY_VERSION}_checksums.txt"
          grep " ${file}\$" "trivy_${TRIVY_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "${file}" trivy
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # ------------------------------------------------------
      # Step 6: Scan image for vulnerabilities
      #
      # Trivy checks OS packages and application dependencies
      # inside the image.
      #
      #   --severity HIGH,CRITICAL  only serious findings count
      #   --ignore-unfixed          do not fail on problems that
      #                             nobody can fix yet
      #   .trivyignore (optional, in the app repo) lists approved
      #   exceptions, one CVE id per line, with a comment why.
      # ------------------------------------------------------
      - name: Scan Docker image with Trivy
        shell: bash
        env:
          IMAGE_REF: ${{ steps.version.outputs.image-name }}:${{ steps.version.outputs.image-tag }}
          EXIT_CODE: ${{ inputs.fail-on-vulnerabilities && '1' || '0' }}
        run: |
          set -o pipefail
          trivy image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code "${EXIT_CODE}" \
            --format table \
            "${IMAGE_REF}" | tee trivy-report.txt

      # ------------------------------------------------------
      # Step 7: Keep the scan report (even when the scan fails)
      # so developers can download it from the run summary.
      # ------------------------------------------------------
      - name: Upload Trivy report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-report-${{ steps.version.outputs.image-name }}
          path: trivy-report.txt
          retention-days: 7
          if-no-files-found: ignore

      # ------------------------------------------------------
      # Steps 8-11 run ONLY for a push to main (env.PUSH).
      # The image reached this point = tests passed + scan passed.
      #
      # Step 8: log in to the 3 clouds with the identity card.
      #   AWS   -> role gha-push-<this service> (own repository only)
      #   Azure -> identity id-gha-push (AcrPush on our registry)
      #   GCP   -> service account gha-push (writer on "mern")
      #
      # continue-on-error: a cloud that is down must not stop the
      # push to the other two. The push step reads each login's
      # result (steps.<id>.outcome) and skips the failed ones.
      # ------------------------------------------------------
      - name: Log in to AWS (keyless)
        id: aws
        if: ${{ env.PUSH == 'true' }}
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_PUSH_ROLE_PREFIX }}${{ steps.version.outputs.image-name }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Azure (keyless)
        id: azure
        if: ${{ env.PUSH == 'true' }}
        continue-on-error: true
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Google Cloud (keyless)
        id: gcp
        if: ${{ env.PUSH == 'true' }}
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_PUSH_SERVICE_ACCOUNT }}
          token_format: access_token

      # ------------------------------------------------------
      # Step 9: push the SAME local image (same digest) to every
      # registry we could log in to - each one on its own, so one
      # broken cloud never blocks the other two.
      #
      # A tag is never overwritten: if a registry already has it
      # (e.g. this run is a re-run), that registry is skipped.
      # A push is tried 3 times (short network hiccups).
      # Passwords go through stdin, never on the command line.
      # ------------------------------------------------------
      - name: Push to ECR, ACR and Artifact Registry
        id: push
        if: ${{ env.PUSH == 'true' }}
        shell: bash
        env:
          LOCAL_IMAGE: ${{ steps.version.outputs.image-name }}:${{ steps.version.outputs.image-tag }}
          IMAGE_NAME: ${{ steps.version.outputs.image-name }}
          IMAGE_TAG: ${{ steps.version.outputs.image-tag }}
          GCP_TOKEN: ${{ steps.gcp.outputs.access_token }}
          AWS_LOGIN: ${{ steps.aws.outcome }}
          AZURE_LOGIN: ${{ steps.azure.outcome }}
          GCP_LOGIN: ${{ steps.gcp.outcome }}
          RETRY_WAIT: "10" # seconds; the 2nd retry waits twice as long
        run: |
          set -uo pipefail # no -e: one failing cloud must not stop the others

          registry_login() {
            case "$1" in
              aws)   aws ecr get-login-password --region "${AWS_REGION}" \
                       | docker login --username AWS --password-stdin "${ECR_REGISTRY}" ;;
              azure) az acr login --name "${ACR_NAME}" ;;
              gcp)   printf '%s' "${GCP_TOKEN}" \
                       | docker login --username oauth2accesstoken --password-stdin "https://${GAR_REGISTRY%%/*}" ;;
            esac
          }

          # push_to <cloud> <registry> <login outcome> - 0 when the registry has the image
          push_to() {
            local cloud="$1" target="$2/${IMAGE_NAME}:${IMAGE_TAG}" outcome="$3"
            if [ "${outcome}" != "success" ]; then
              echo "::warning::${cloud}: login to the cloud failed - not pushed to ${target}"
              echo "- ${target} (NOT pushed: ${cloud} login failed)" >> "$GITHUB_STEP_SUMMARY"
              return 1
            fi
            if ! registry_login "${cloud}"; then
              echo "::warning::${cloud}: registry login failed - not pushed to ${target}"
              echo "- ${target} (NOT pushed: registry login failed)" >> "$GITHUB_STEP_SUMMARY"
              return 1
            fi
            if docker manifest inspect "${target}" > /dev/null 2>&1; then
              echo "::notice::${target} already exists - tags are never overwritten, skipping"
              echo "- ${target} (already there)" >> "$GITHUB_STEP_SUMMARY"
              return 0
            fi
            docker tag "${LOCAL_IMAGE}" "${target}"
            for attempt in 1 2 3; do
              if docker push "${target}"; then
                echo "- ${target} (pushed)" >> "$GITHUB_STEP_SUMMARY"
                return 0
              fi
              echo "${cloud}: push attempt ${attempt} failed"
              if [ "${attempt}" -lt 3 ]; then sleep $((attempt * RETRY_WAIT)); fi
            done
            echo "::warning::${cloud}: push failed 3 times - not pushed to ${target}"
            echo "- ${target} (NOT pushed: push failed 3 times)" >> "$GITHUB_STEP_SUMMARY"
            return 1
          }

          echo "### Image ${IMAGE_NAME}:${IMAGE_TAG}" >> "$GITHUB_STEP_SUMMARY"
          ok=()
          missing=()
          if push_to aws "${ECR_REGISTRY}" "${AWS_LOGIN}"; then ok+=(aws); else missing+=(aws); fi
          if push_to azure "${ACR_NAME}.azurecr.io" "${AZURE_LOGIN}"; then ok+=(azure); else missing+=(azure); fi
          if push_to gcp "${GAR_REGISTRY}" "${GCP_LOGIN}"; then ok+=(gcp); else missing+=(gcp); fi

          pushed_to="$(IFS=,; echo "${ok[*]}")"
          echo "pushed-to=${pushed_to}" >> "$GITHUB_OUTPUT"

          if [ "${#ok[@]}" -eq 0 ]; then
            echo "::error::The image reached NO registry - nothing can be deployed"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            missing_list="$(IFS=,; echo "${missing[*]}")"
            msg="Image is in ${pushed_to} only (missing: ${missing_list}) - no automatic deploy. When ${missing_list} is back, re-run this workflow (Re-run all jobs): it fills the gap, then deploys. To deploy now to the clouds that have it: Jenkins deploy-mern with TARGETS=${pushed_to}, or playbooks/deploy.yml -e target=<cloud>."
            echo "::warning::${msg}"
            printf '\n**%s**\n' "${msg}" >> "$GITHUB_STEP_SUMMARY"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "pushed=true" >> "$GITHUB_OUTPUT"
